name: BookHarbor real catalog downloads

on:
  push:
    branches:
      - feature/bookharbor-v0.2-library-upgrade
      - feature/bookharbor-v0.3-archive-explorer
    paths:
      - 'tests/live_catalog_smoke.py'
      - 'tests/live_archive_explorer_smoke.py'
      - 'tests/scrape_cursor_probe.py'
      - 'tests/test_archive_explorer.py'
      - 'tests/test_resume_v03.py'
      - 'tests/provider_probe.py'
      - 'tests/test_providers.py'
      - 'tests/test_downloads.py'
      - 'bookharbor/**'
      - '.github/workflows/live-catalog-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bookharbor-live-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-catalog-downloads:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx
      - name: Run complete offline regression suite
        run: PYTHONPATH=. python -m pytest -q
      - name: Diagnose official discovery endpoints
        run: python tests/provider_probe.py
      - name: Run real ebook catalog and download smoke tests
        env:
          BOOKHARBOR_CONTACT: https://github.com/SaridakisStamatisChristos/BookHarbor
        run: PYTHONPATH=. python tests/live_catalog_smoke.py
      - name: Diagnose Archive cursor cache behavior
        run: PYTHONPATH=. python tests/scrape_cursor_probe.py
      - name: Live Internet Archive cursor discovery smoke test
        run: PYTHONPATH=. python tests/live_archive_explorer_smoke.py
      - name: Store machine-readable smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bookharbor-live-catalog-results
          path: live_smoke_report.json
          if-no-files-found: warn
